[package]
name        = "cantaya-kernel"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name  = "cantaya-kernel"
path  = "src/main.rs"
test  = false
bench = false

[dependencies]
cantaya-shared          = { path = "../shared" }
aarch64-cpu             = "9.4.0"
tock-registers          = "0.8"
spin                    = { version = "0.9",  default-features = false, features = ["mutex", "spin_mutex", "rwlock", "once", "lazy"] }
linked_list_allocator   = { version = "0.10", default-features = false }
bitflags                = "2.6"
log                     = { version = "0.4",  default-features = false }

[build-dependencies]
# No external build deps needed — assembly is included via global_asm!
